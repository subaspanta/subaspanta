<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="180" viewBox="0 0 1200 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <style>
    .star { fill: #ffffff; animation: twinkle 2.5s ease-in-out infinite; }
    .s2 { animation-delay: 0.4s; }
    .s3 { animation-delay: 0.8s; }
    .s4 { animation-delay: 1.2s; }
    .s5 { animation-delay: 1.6s; }
    .s6 { animation-delay: 2s; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.9; }
    }
  </style>
  <rect width="1200" height="180" fill="url(#bg)" />
  <circle class="star s1" cx="90" cy="35" r="1.6" />
  <circle class="star s2" cx="220" cy="120" r="1.2" />
  <circle class="star s3" cx="340" cy="50" r="1.8" />
  <circle class="star s4" cx="860" cy="40" r="1.4" />
  <circle class="star s5" cx="980" cy="130" r="1.7" />
  <circle class="star s6" cx="1110" cy="60" r="1.3" />
  <circle class="star s3" cx="150" cy="150" r="1.1" />
  <circle class="star s5" cx="1050" cy="30" r="1.2" />
  <text x="600" y="88" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="42" font-weight="700" fill="#ffffff">
    Hi, I'm Subas 👋
  </text>
  <text x="600" y="124" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="18" fill="#94a3b8">
    Fullstack Developer · AI &amp; DevOps Explorer
  </text>
</svg>
